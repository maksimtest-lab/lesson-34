            button {

            }

            button#createBtn {

            }

            button#filterBtn {
                background-color: #007bff;
            }

            button#searchBtn {
                background-color: #17a2b8;
            }

            button#clearBtn {
                background-color: #6c757d;
            }

            button.pagination-btn {
                background-color: #ffc107;
            }

            button.delete-btn {
                background-color: #dc3545;
            }

            button.edit-btn {
                background-color: #20c997;
            }

            .post {
                background: #fff;

<body>
    <h1>Задание 4. Создание простого REST AP</h1>

    <p>
        Реализуйте простое REST API для управления списком книг. Реализуйте операции CRUD (создание, чтение, обновление, удаление).
    </p>

    <p>Использовал фейковый API: <a href="https://www.freetestapi.com/apis/books" target="_blank">https://www.freetestapi.com/apis/books</a></p>

    <h2>Книги</h2>

    <h3>Создать запись в библиотеку</h3>
    <form id="createForm">
        <div class="form-group">
            <label for="title">Загловок</label>
            <input type="text" id="title" placeholder="Загловок" required />
        </div>

        <div class="form-group">
            <label for="description">Описание</label>
            <input type="text" id="description" placeholder="Описание" required />
        </div>

        <div class="form-group">
            <label for="author">Автор книги</label>
            <input type="text" id="author" placeholder="Автор" required />
        </div>

        <div class="form-group">
            <label for="publication_year">Год публикации книги</label>
            <input type="text" id="publication_year" placeholder="Год" required />
        </div>

        <div class="form-group">
            <label for="genre">Жанр книги</label>
            <input type="text" id="genre" placeholder="Жанр" required />
        </div>

        <div class="form-group">
            <label for="cover_image">Обложка</label>
            <input type="text" id="cover_image" placeholder="Обложка" value="https://fakeimg.pl/667x1000/b7c0f1" required />
        </div>

        <button id="createBtn" type="submit">Создать</button>
    </form>

    <h3>Список книг</h3>
    <div id="bookList"></div>


    <script src="./task4.js"></script>

</body>
